spring.application.name=${APP_NAME}

# Database Configuration
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER}

# Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=${SERVER_PORT}

# JWT Configuration
app.jwtSecret=b5438a3e1079739efa81c081312d8719297dd8d835e68af626d28ff14f35e609020245b57f3a5e70ee9ba372017f60ff2a7011cd61fb5407ef6af25c71532609
app.jwtExpirationMs=86400000

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Queue Configuration
rabbitmq.customer.queue=${RABBITMQ_CUSTOMERS_QUEUE}
rabbitmq.messages.queue=${RABBITMQ_MESSAGES_QUEUE}
rabbitmq.payment.queue=${RABBITMQ_PAYMENTS_QUEUE}
rabbitmq.queue.durable=true

# Payment Queue Configuration
rabbitmq.payment.response-queue=${RABBITMQ_PAYMENT_STATUS_QUEUE}

# Notification Configuration
# Options: EMAIL, SMS, or BOTH
notification.preferred-method=EMAIL

# Email Configuration
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SMS Configuration (example using Twilio, update with your provider)
sms.provider=${SMS_PROVIDER}
sms.twilio.account-sid=${SMS_ACCOUNT_ID}
sms.twilio.auth-token=${SMS_AUTH_TOKEN}
sms.twilio.phone-number=${SMS_PHONE_NUMBER}

# File Upload Configuration
spring.servlet.multipart.max-file-size=${FILE_UPLOAD_SIZE}
spring.servlet.multipart.max-request-size=${POST_REQUEST_SIZE}

# Payment Service Configuration
payment.service.base-url=${PAYMENT_SERVICE_URL}
payment.service.api-key=${PAYMENT_SERVICE_API_KEY}

# Retry configuration
spring.retry.max-attempts=3
spring.retry.backoff.initial-interval=1000
spring.retry.backoff.multiplier=2.0

# Logging
logging.level.tz.co.flex=DEBUG
logging.level.org.springframework.retry=DEBUG

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activate=true
springdoc.swagger-ui.syntaxHighlight.theme=monokai
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.url=/api-docs

# Bucket4j Rate Limiting Configuration
# Global rate limit: 1000 requests per second per IP
bucket4j.enabled=true
bucket4j.cache-to-use=jcache
bucket4j.filters[0].cache-name=rate-limit-buckets
bucket4j.filters[0].url=/api/.*
bucket4j.filters[0].strategy=first
bucket4j.filters[0].http-response-body={ "error": "Too many requests", "status": 429 }
bucket4j.filters[0].rate-limits[0].bandwidths[0].capacity=1000
bucket4j.filters[0].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[0].rate-limits[0].bandwidths[0].unit=seconds
bucket4j.filters[0].rate-limits[0].bandwidths[0].refill-speed=interval
bucket4j.filters[0].rate-limits[0].execute-condition=true
# bucket4j.filters[0].rate-limits[0].skip-condition=@securityService.isAdmin(getRemoteAddr())

# JCache Configuration for Bucket4j
spring.cache.type=jcache
spring.cache.jcache.config=classpath:ehcache.xml
