# Application Configuration
spring.application.name=${APP_NAME}

# Database Configuration
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER}

# Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=${SERVER_PORT}

# JWT Configuration
app.jwt.secret=b5438a3e1079739efa81c081312d8719297dd8d835e68af626d28ff14f35e609020245b57f3a5e70ee9ba372017f60ff2a7011cd61fb5407ef6af25c71532609
app.jwt.expiration-ms=86400000

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Queue Configuration
rabbitmq.queue.name=${RABBITMQ_PAYMENT_QUEUE}
rabbitmq.status.name=${RABBITMQ_PAYMENT_STATUS_QUEUE}
rabbitmq.queue.durable=true

# Webhook Configuration
webhook.timeout=5000
webhook.max-retries=3
webhook.retry-delay=1000

# Bucket4j Rate Limiting Configuration
# Global rate limit: 1000 requests per second per IP
bucket4j.cache-to-use=jcache
bucket4j.enabled=true
bucket4j.filters[0].cache-name=rate-limit-buckets
bucket4j.filters[0].url=.*
bucket4j.filters[0].http-response-body={ "message": "Too many requests" }
bucket4j.filters[0].rate-limits[0].bandwidths[0].capacity=1000
bucket4j.filters[0].rate-limits[0].bandwidths[0].time=1
bucket4j.filters[0].rate-limits[0].bandwidths[0].unit=seconds
bucket4j.filters[0].strategy=first
bucket4j.filters[0].rate-limits[0].bandwidths[0].refill-speed=interval
bucket4j.filters[0].rate-limits[0].execute-condition=getRemoteAddr()
bucket4j.filters[0].rate-limits[0].skip-condition=@securityService.isAdmin(getRemoteAddr())

# Cache Configuration
spring.cache.type=caffeine
spring.cache.cache-names=rate-limit-buckets
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=1h

#bucket4j.filters[0].cache-to-use=caffeine

# Logging
logging.level.tz.co.flex=DEBUG
logging.level.org.springframework.retry=DEBUG


# =======================================
# Swagger UI Configuration
# =======================================
# Base URL for Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Enable/Disable Swagger UI (default: true)
springdoc.swagger-ui.enabled=true

# Custom URL for the OpenAPI documentation (JSON format)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.url=/api-docs

# Display settings
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activate=true
springdoc.swagger-ui.syntaxHighlight.theme=monokai

# Layout and sorting
springdoc.swagger-ui.layout=StandaloneLayout
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.defaultModelRendering=example

# Try it out functionality
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.requestSnippetsEnabled=true

# Persist authorization
springdoc.swagger-ui.persistAuthorization=true

# OAuth2 configuration
springdoc.swagger-ui.oauth.clientId=your-client-id
springdoc.swagger-ui.oauth.usePkceWithAuthorizationCodeGrant=true

# Cache control
springdoc.cache.disabled=true

