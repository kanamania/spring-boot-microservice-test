services:
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: developer
      POSTGRES_DB: postgres
    ports:
      - "9000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U developer -d flex_sms"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - flex_bulk_sms_net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: k.mahenge@gmail.com
      PGADMIN_DEFAULT_PASSWORD: developer@Db
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: developer
      RABBITMQ_DEFAULT_PASS: developer    
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flex_bulk_sms_net

  sms:
    build: ./flex_sms
    container_name: flex_sms
    env_file:
      - ./flex_sms/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flex_sms
      SPRING_DATASOURCE_USERNAME: developer
      SPRING_DATASOURCE_PASSWORD: developer
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: developer
      SPRING_RABBITMQ_PASSWORD: developer
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks:
      - flex_bulk_sms_net

  payment:
    build: ./flex_payment
    container_name: flex_payment
    env_file:
      - ./flex_payment/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flex_payment
      SPRING_DATASOURCE_USERNAME: developer
      SPRING_DATASOURCE_PASSWORD: developer
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: developer
      SPRING_RABBITMQ_PASSWORD: developer
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8082:8080"
    networks:
      - flex_bulk_sms_net
      
